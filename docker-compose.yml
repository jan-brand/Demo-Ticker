services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo_ticker
      POSTGRES_USER: demo_ticker
      POSTGRES_PASSWORD: demo_ticker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_ticker -d demo_ticker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
