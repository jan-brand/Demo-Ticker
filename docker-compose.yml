services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo_ticker
      POSTGRES_USER: demo_ticker
      POSTGRES_PASSWORD: demo_ticker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_ticker -d demo_ticker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production services. Not started by `docker compose up -d postgres`;
  # start them with `docker compose --profile app up -d --build`.
  migrate:
    profiles: ["app"]
    build: .
    command: ["node", "src/db/migrate.js"]
    environment: &app-env
      DATABASE_URL: postgres://demo_ticker:demo_ticker@postgres:5432/demo_ticker
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Fetches the assemblies regularly (interval: IMPORT_INTERVAL_MINUTES, default 60) and keeps the archive growing.
  importer:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    command: ["node", "src/jobs/scheduler.js"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
